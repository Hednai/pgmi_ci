# ============================================
# .github/workflows/ci.yml
# Pipeline CI : types, lint, tests et build pour le frontend et le backend.
#
# Déclenché sur chaque poussée vers main ou dev, et sur chaque pull request
# vers ces branches. Les exécutions en cours sont annulées si une nouvelle
# poussée arrive sur la même branche.
# ============================================
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Annule les exécutions précédentes encore en cours sur la même branche
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Permissions minimales (principe du moindre privilège)
permissions:
  contents: read

jobs:
  # ---- Backend : types, tests unitaires, build ----
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Installation de Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Installation des dépendances
        run: npm ci

      # Le client Prisma est généré avant la compilation : sans lui, les
      # types du schéma n'existent pas et tsc échoue.
      - name: Génération du client Prisma
        run: npx prisma generate

      - name: Vérification des types
        run: npx tsc --noEmit

      - name: Tests unitaires
        run: npm test

      # Le manuel des habilitations est généré depuis la matrice. S'il n'est
      # plus à jour, c'est que la matrice a changé sans que le document
      # publié suive : la chaîne le signale au lieu de laisser diverger.
      - name: Manuel des habilitations à jour
        run: |
          npm run manuel:habilitations
          git diff --exit-code ../MANUEL_HABILITATIONS.md

      - name: Build de production
        run: npm run build

      # Signale les vulnérabilités connues sans bloquer la chaîne sur un
      # avertissement de dépendance transitive.
      - name: Audit de sécurité
        run: npm audit --audit-level=high
        continue-on-error: true

  # ---- Frontend : types, build de production ----
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      # Le mode démonstration doit être actif pour que le build frontend
      # inclue les données de démonstration et réussisse le typage.
      VITE_MODE_DEMO: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Installation de Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installation des dépendances
        run: npm ci

      # Appel direct au compilateur : la vérification ne dépend pas du contenu
      # du script lint, qui peut changer sans que la chaîne le signale.
      - name: Vérification des types
        run: npx tsc --noEmit

      - name: Build de production
        run: npm run build

  # ---- Bout en bout : parcours complets dans un vrai navigateur ----
  #
  # Les tests unitaires vérifient des règles isolées. Ils ne vérifient pas
  # qu'un marin traverse réellement un parcours. Ce travail tourne contre le
  # mode démonstration, sans base ni backend : un test de bout en bout qui
  # exigerait PostgreSQL et Supabase ne tournerait jamais ici, donc ne
  # tournerait jamais.
  e2e:
    name: Bout en bout
    runs-on: ubuntu-latest
    # Inutile de lancer un navigateur si le frontend ne compile même pas
    needs: frontend
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4

      - name: Installation de Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Installation des dépendances du frontend
        working-directory: frontend
        run: npm ci

      - name: Installation des dépendances de test
        run: npm ci

      # Chromium seul : les trois navigateurs tripleraient la durée sans rien
      # apprendre de plus sur des parcours qui n'utilisent aucune API exotique.
      - name: Installation du navigateur
        run: npx playwright install --with-deps chromium

      - name: Exécution des parcours
        run: npx playwright test --project=chromium

      # Conservé seulement en cas d'échec : le rapport est volumineux.
      - name: Conservation du rapport
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-playwright
          path: e2e/playwright-report/
          retention-days: 7